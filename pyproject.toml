[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taper"
version = "0.1.0"
description = "A settlement reconciliation agent that shrinks its own AI usage over time"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sarthak", email = "0906sarthak@gmail.com" }]
keywords = ["reconciliation", "fintech", "payments", "settlement", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.optional-dependencies]
# The model client is optional on purpose: the deterministic layers and the
# offline mock must run with zero third-party dependencies, so CI and any
# reviewer without an API key can still execute the full pipeline.
llm = ["anthropic>=0.40.0"]
# Optional. The exception-risk model falls back to a dependency-free
# logistic regression when scikit-learn is absent, so nothing breaks
# without it - the evaluation simply reports the weaker backend.
ml = ["scikit-learn>=1.4"]
dev = [
    "anthropic>=0.40.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "scikit-learn>=1.4",
]

[project.urls]
Repository = "https://github.com/Sarthak-47/Razorpay"

[project.scripts]
taper = "taper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",  # dataclass defaults via field() read fine here
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.coverage.run]
source = ["src/taper"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
